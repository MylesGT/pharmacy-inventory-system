<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>The Clinical Hot-Seat</title>
</head>
<body>
    <div id="stopwatch">00:00</div>
    
    <div class="container">
        <h1>The Clinical Hot-Seat</h1>
        <p>Pharmacy Knowledge Verification</p>
        
        <div class="difficulty-box">
            <label for="difficulty">Select Difficulty (1 - 10):</label>
            <input type="range" id="difficulty" min="1" max="10" value="5" oninput="updateDiff(this.value)">
            <div id="diffLabel">5</div>
        </div>

        <button onclick="generateQuestion()">Generate Question</button>
        
        <div id="quiz-area">
            </div>

        <button onclick="location.reload()" style="background-color: #7f8c8d; margin-top: 20px;">Reset Gauntlet</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
