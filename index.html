<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>The Clinical Hot-Seat</title>
</head>
<body>

   <div id="quiz-container">
    <h2>The Clinical Hot-Seat</h2>
    <p>Pharmacy Knowledge Verification</p>

    <label for="difficulty">Select Difficulty (1 - 10):</label>
    <input type="range" id="difficulty" min="1" max="10" value="5" oninput="updateDiff(this.value)">
    <span id="diffLabel">5</span>

    <button onclick="generateQuestion()">Generate Question</button>

    <div id="quiz-area"></div>

    <button onclick="location.reload()">Reset Gauntlet</button>
</div>

<script src="script.js"></script>
</body>
</html>
