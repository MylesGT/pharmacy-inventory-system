<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>The Clinical Hot-Seat</title>
</head>
<body>

    <div class="container">
        <h1>The Clinical Hot-Seat</h1>
        <p><i>Pharmacy Knowledge Verification</i></p>

        <div class="setup-section">
            <p>Select Difficulty (1 - 10):</p>
            <input type="range" id="difficulty" min="1" max="10" value="5" oninput="updateDiff(this.value)">
            <h2 id="diffLabel">5</h2>
            <button onclick="generateQuestion()">Generate Question</button>
        </div>

        <div id="quiz-area">
            Choose a difficulty to begin the gauntlet.
        </div>
        <button onclick="location.reload()" style="background-color: #95a5a6; margin-top: 10px;">Reset Gauntlet</button>
    </div>

<script src="script.js"></script>
</body>
</html>
